<main>
  <h1>チャンネル管理（channel-manager）</h1>
  <p>YouTube チャンネルの運営を手伝う、個人用の道具です。使う人のパソコンの中だけで動きます。</p>
  <ul>
    <li>競合のチャンネルの公開されている数字を集めて、伸びている動画を見つけます</li>
    <li>許可をもらった自分のチャンネルの数字（再生数・平均視聴率・流入元など）を読み、分析します</li>
    <li>動画の変更・削除・投稿は行いません（読み取りだけの許可を使います）</li>
  </ul>
  <p><a href="privacy.html">プライバシーポリシー（Privacy Policy）</a></p>
</main>
